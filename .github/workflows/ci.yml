name: reproducible-offline-lab
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
      - name: Install tested dependency versions
        run: python -m pip install -c requirements-lock.txt -e '.[dashboard,dev]'
      - name: Lint and format
        run: |
          ruff check .
          ruff format --check .
      - name: Verify committed evidence before regeneration
        run: python scripts/check_reproducibility.py
      - name: Recompute balanced image-intervention evidence (no model inference)
        run: python scripts/verify_grounding.py
      - name: Run offline demo
        run: flywheel demo --data-dir work/rule-replay/data --report-dir work/rule-replay/reports
      - name: Test all layers and Dashboard
        run: pytest -q
      - name: Validate dataset and publishable contents
        run: |
          flywheel validate --data-dir work/rule-replay/data
          python scripts/privacy_check.py
      - name: Archive actual run evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offline-evaluation-evidence
          path: work/rule-replay/reports
          retention-days: 14
